<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./output.css">
    <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="font-['Poppins'] m-0 min-h-screen flex justify-center items-center bg-gray-100">
    <div id="container" class="w-[350px] p-6 bg-white rounded-xl shadow-lg">
          <h2 class="font-bold text-2xl text-center mb-5">Registration Form</h2>
        <form id="Registrationform">
         <!-- Name -->
          <div class="mb-4">
            <label class="block mb-1 font-bold">Name</label>
            <input type="text" id="name" placeholder="Enter your Name" class="border border-gray-400 w-full p-2.5 rounded-md outline-none focus:border-gray-800">
            <span id="nameError" class="block text-red-500 text-xs mt-1"></span>
          </div>
          <!-- Email -->
          <div class="mb-4">
            <label class="block mb-1 font-bold">Email</label>
            <input type="text" id="email" placeholder="Enter your Email" class="border border-gray-400 w-full p-2.5 rounded-md outline-none focus:border-gray-800">
            <span id="emailError" class="block text-red-500 text-xs mt-1"></span>
          </div>
          <!-- Password -->
          <div class="mb-4">
            <label class="block mb-1 font-bold">Password</label>
            <input type="password" id="password" placeholder="Enter your Password" class="border border-gray-400 w-full p-2.5 rounded-md outline-none focus:border-gray-800">
            <span id="passwordError" class="block text-red-500 text-xs mt-1"></span>
          </div>
          <!-- submit -->
            <button type="submit" id="submitbtn" disabled class="w-full p-2.5 bg-gray-800 text-white rounded-md cursor-pointer disabled:bg-gray-400 disabled:cursor-not-allowed">submit</button>
            <!-- Successfull Message -->
             <p id="Successfull" class="text-green-500 text-center mt-4 font-bold"></p>
        </form>
    </div>
<!-- JavaScript -->
    <script>
      // Selecting Elements
      var nameInput=document.getElementById("name")
      var email=document.getElementById("email")
      var password=document.getElementById("password")
      var nameError=document.getElementById("nameError")
      var emailError=document.getElementById("emailError")
      var passwordError=document.getElementById("passwordError")
      var submitbtn=document.getElementById("submitbtn")
      var form=document.getElementById("Registrationform")
      var Successfull=document.getElementById("Successfull")
      // Validation Form
      function validateform(){
        var isNameValid=false
        var isEmailValid=false
        var isPasswordValid=false
         // Name Validation
      if(nameInput.value.trim() ===""){
        nameError.textContent="Name is Required"
        isNameValid=false
      }
      else{
        nameError.textContent=""
        isNameValid=true
      }
      // Email Validation
      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if(email.value.trim() ===""){
        emailError.textContent="Email is Required"
        isEmailValid=false
      }
      else if(!emailPattern.test(email.value)){
        emailError.textContent="Enter a Valid email Address"
        isEmailValid=false
      }
      else{
        emailError.textContent=""
        isEmailValid=true
      }
      // Password Validation
      if(password.value.length<6){
        passwordError.textContent="Password must Contain at least 6 letters"
        isPasswordValid=false
      }
      else{
        passwordError.textContent=""
        isPasswordValid=true
      }
      // Enable button Only When all fields are valid
      submitbtn.disabled=!(isNameValid && isEmailValid && isPasswordValid)
      }
    //  Real Time Validation 
      nameInput.addEventListener("input", validateform);
      email.addEventListener("input", validateform);
      password.addEventListener("input", validateform);

      // form Submission
      form.addEventListener("submit",function(event){
        event.preventDefault()
        Successfull.textContent="Registration Successfull!"
        form.reset()
        submitbtn.disabled=true
      })
    </script>
</body>
</html>
